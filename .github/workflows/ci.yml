name: Site CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: read

concurrency:
  group: site-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test dispatch and safe-merge gates
        run: python3 -m unittest discover -s tests -p "*_test.py" -v
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build the site with the Pages Jekyll builder
        uses: actions/jekyll-build-pages@v1
