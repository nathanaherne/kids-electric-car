# Merge and deploy continuation for Cursor issue pull requests.
# This workflow is intentionally not triggered by issues. cursor_issues.yml
# remains the only issue dispatcher. GitHub runs workflow_run from the default
# branch, and the job checks out that branch with no credentials so the pull
# request cannot replace the gate.

name: Cursor publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to evaluate"
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: write
  pages: write
  pull-requests: write
  statuses: read

concurrency:
  group: cursor-publish-${{ github.event.inputs.pr_number || github.event.workflow_run.head_sha || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'workflow_run' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request == null &&
          contains(github.event.comment.body, 'cursor-issue-agent:v1') &&
          contains(github.event.comment.body, 'status=completed')
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test publish gates
        run: python3 -m unittest tests/cursor_publish_test.py tests/dispatch_cursor_issue_test.py
      - name: Publish safe Cursor pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: python3 scripts/cursor_publish.py
